<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">CYPHER-X logo</title>
  <desc id="desc">A blue cyan shield containing connected infrastructure nodes and a lock, with the CYPHER-X wordmark and the tagline Analyze, Simulate, Defend.</desc>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0877ff"/><stop offset="1" stop-color="#00e5f5"/></linearGradient>
    <linearGradient id="xgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5f5"/><stop offset="1" stop-color="#0877ff"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="800" fill="#030712" rx="30"/>
  <g transform="translate(600 265)" filter="url(#glow)">
    <path d="M0 -170 L150 -112 L150 12 C150 104 84 161 0 204 C-84 161 -150 104 -150 12 L-150 -112 Z" fill="none" stroke="url(#neon)" stroke-width="13" stroke-linejoin="round"/>
    <circle cx="0" cy="-5" r="88" fill="none" stroke="url(#neon)" stroke-width="5" opacity=".9"/>
    <g stroke="#00dff3" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M-63 -65 L-29 -36 L20 -70 L61 -37"/>
      <path d="M-87 8 L-49 8 L-22 39 L25 39 L75 12"/>
      <path d="M-31 77 L-12 52 L22 70 L42 56"/>
    </g>
    <g fill="url(#neon)">
      <circle cx="-63" cy="-65" r="10"/><circle cx="-29" cy="-36" r="8"/><circle cx="20" cy="-70" r="10"/><circle cx="61" cy="-37" r="10"/>
      <circle cx="-87" cy="8" r="10"/><circle cx="-49" cy="8" r="8"/><circle cx="25" cy="39" r="8"/><circle cx="75" cy="12" r="10"/>
      <circle cx="-31" cy="77" r="8"/><circle cx="42" cy="56" r="8"/>
    </g>
    <path d="M-43 -5 v-22 a43 43 0 0 1 86 0 v22" fill="none" stroke="#f4fbff" stroke-width="11" stroke-linecap="round"/>
    <rect x="-57" y="-9" width="114" height="88" rx="16" fill="url(#neon)" stroke="#a4f6ff" stroke-width="2"/>
    <circle cx="0" cy="25" r="10" fill="#03101d"/><path d="M0 34 v18" stroke="#03101d" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="600" y="580" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="800" letter-spacing="3" text-anchor="middle">CYPHER-<tspan fill="url(#xgrad)">X</tspan></text>
  <text x="600" y="644" fill="#d8e7f7" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" letter-spacing="8" text-anchor="middle">ANALYZE <tspan fill="#00dff3">/</tspan> SIMULATE <tspan fill="#00dff3">/</tspan> DEFEND</text>
</svg>